name: Windows installer

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.11.1
          cache: npm
      - name: Install NSIS
        shell: powershell
        run: choco install nsis --yes --no-progress
      - name: Build installer and run tests
        shell: powershell
        run: ./scripts/build-windows.ps1
      - name: Smoke test Windows installation
        shell: powershell
        run: ./scripts/smoke-windows.ps1
      - name: Upload installer for review
        uses: actions/upload-artifact@v4
        with:
          name: PrintRocketClient-Windows
          path: |
            dist/PrintRocketClient-Setup.exe
            dist/SHA256SUMS.txt
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create $env:GITHUB_REF_NAME dist/PrintRocketClient-Setup.exe dist/SHA256SUMS.txt --title $env:GITHUB_REF_NAME --generate-notes
